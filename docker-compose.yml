services:
  web:
    build:
      context: .
      # Build args are resolved from shell env / --env-file, NOT from env_file below.
      # The `:?` guard makes a missing value fail the build instead of baking an
      # empty NEXT_PUBLIC_* into the client bundle.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL}
    env_file:
      - .env.production
    ports:
      - "3000:3000"
    restart: unless-stopped
